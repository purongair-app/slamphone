<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SLAM · อ่านบัตรประชาชน</title><style>body{font:16px Tahoma,sans-serif;background:#edf5fa;color:#19324c;margin:0;padding:30px}main{max-width:520px;margin:0 auto;background:white;padding:28px;border-radius:18px}h1{font-size:24px}p{line-height:1.8;overflow-wrap:anywhere}button{background:#087caa;color:white;border:0;border-radius:8px;padding:14px 20px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap}#preview{padding:16px;background:#edf5fa;border-radius:10px;white-space:pre-wrap}</style><main><h1>อ่านบัตรประชาชน · SLAM</h1><p>เครื่องอ่านต่อกับคอมเครื่องนี้ ข้อมูลชื่อ เลขบัตร วันเกิด และที่อยู่จะเติมในแบบฟอร์มลูกค้าหรืองานซ่อมที่เปิดอยู่ โปรแกรมนี้ไม่บันทึกข้อมูลบัตรลงไฟล์</p><p id="destination"></p><p>ขอความยินยอมจากลูกค้าก่อนอ่านบัตร แล้วกดเริ่มและเสียบบัตรภายใน 25 วินาที</p><button id="read" disabled>เริ่มอ่านเมื่อเสียบบัตร</button><p id="status" role="status"></p><p id="preview" hidden></p><button id="send" hidden>ใช้ข้อมูลนี้เติมแบบฟอร์ม</button></main><script>
const params=new URLSearchParams(location.hash.slice(1)),origin=params.get('origin'),nonce=params.get('nonce');
const valid=origin&&(/^https:\/\/[a-z0-9-]+\.script\.googleusercontent\.com$/.test(origin)||origin==='https://purongair-app.github.io');
const read=document.getElementById('read'),status=document.getElementById('status'),send=document.getElementById('send');let result;
if(!valid||!nonce||!/^[a-f0-9]{32}$/.test(nonce)||!window.opener)status.textContent='กรุณาเปิดหน้าต่างนี้จากปุ่มอ่านบัตรในระบบร้าน';
else{document.getElementById('destination').textContent='ส่งกลับไปยังระบบร้าน: '+origin;read.disabled=false;}
read.onclick=async()=>{read.disabled=true;status.textContent='รอบัตรและกำลังอ่าน…';try{const response=await fetch('/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:'__READ_TOKEN__'})});const body=await response.json();if(!response.ok)throw Error(body.error||'อ่านไม่สำเร็จ');result=body.data;const preview=document.getElementById('preview');preview.textContent=result.name+'\nเลขบัตร: '+result.nationalId+'\nวันเกิด: '+(result.birthDate||'ไม่ระบุครบ')+'\nที่อยู่: '+result.address;preview.hidden=false;send.hidden=false;status.textContent='อ่านสำเร็จ ตรวจชื่อก่อนเติมข้อมูล';}catch(error){status.textContent=error.message+'\nกรุณาปิดแล้วเปิดอ่านบัตรใหม่';}};
send.onclick=()=>{if(!window.opener||window.opener.closed){status.textContent='แบบฟอร์มร้านถูกปิดแล้ว กรุณาเปิดอ่านใหม่';return;}window.opener.postMessage({type:'slam-card-data',nonce,data:result},origin);result=null;document.getElementById('preview').textContent='';send.hidden=true;status.textContent='ส่งข้อมูลแล้ว กลับไปตรวจแบบฟอร์มและกดบันทึกในระบบร้าน';};
</script></html>
