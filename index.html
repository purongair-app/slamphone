<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SLAM Mobile | ร้านขายซ่อมมือถือ</title><style>html,body{margin:0;width:100%;height:100%;background:#f5f7f9;font-family:Tahoma,sans-serif}iframe{display:block;width:100%;height:100%;height:100dvh;border:0}noscript{padding:24px;display:block}#scan-overlay[hidden]{display:none}#scan-overlay{position:fixed;inset:0;z-index:9999;background:#102a35bd;display:flex;justify-content:center;align-items:center;padding:16px;box-sizing:border-box;color:#19343e}#scan-panel{background:white;width:520px;max-width:100%;max-height:92dvh;overflow:auto;border-radius:16px;padding:22px;box-sizing:border-box}#scan-panel h2{font-size:21px;margin:0}#scan-close{float:right}#scan-panel button{border:1px solid #d6e2e6;border-radius:8px;background:#f7faf8;color:#18343e;padding:11px 16px;cursor:pointer;font-family:inherit}#scan-start{background:#19343e!important;color:white!important;margin:10px 0}#scan-video{display:block;width:100%;height:260px;object-fit:cover;background:#122b35;border-radius:9px}#scan-status{font-size:13px;line-height:1.6}#scan-error{color:#b04440;font-size:13px}#scan-panel input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d6e2e6;border-radius:8px;margin:8px 0}#scan-panel label,#scan-panel small{display:block;font-size:12px;line-height:1.6}#scan-use{margin:0 0 12px}</style></head><body><iframe title="SLAM Mobile ระบบร้านขายซ่อมมือถือ" src="https://script.google.com/macros/s/AKfycbw_PBKoGbgALuqxz_G6yRH0SIWs6KGpygD3zVDYZSk8jOdy0hotOAp6TJsyETMj3N2I/exec" allow="clipboard-write" referrerpolicy="no-referrer"></iframe><noscript>กรุณาเปิด JavaScript เพื่อใช้งานระบบร้านมือถือ</noscript><div id="scan-overlay" hidden><section id="scan-panel" role="dialog" aria-modal="true" aria-labelledby="scan-title"><button id="scan-close" aria-label="ปิดหน้าสแกน">ปิด ✕</button><h2 id="scan-title">สแกนบาร์โค้ดสินค้า</h2><p id="scan-status" role="status"></p><button id="scan-start">เปิดกล้อง / ลองใหม่</button><video id="scan-video" muted playsinline autoplay></video><p id="scan-error" role="alert"></p><p>สแกนรหัส SKU / IMEI บนตัวเครื่องหรือกล่องสินค้า</p><label for="scan-manual">กรอกรหัสเอง / ใช้เครื่องสแกนบาร์โค้ด</label><input id="scan-manual" autocomplete="off" placeholder="SKU / IMEI"><button id="scan-use">ใช้รหัสค้นหา</button><small>ระบบส่งเฉพาะรหัสที่อ่านได้กลับไปช่องค้นหา ภาพจากกล้องไม่ถูกอัปโหลด และกล้องปิดเมื่อสแกนสำเร็จหรือกดปิด</small></section></div><script>(function(){
'use strict';
var overlay=document.getElementById('scan-overlay'),video=document.getElementById('scan-video'),status=document.getElementById('scan-status'),error=document.getElementById('scan-error'),start=document.getElementById('scan-start'),manual=document.getElementById('scan-manual');
var current=null,stream=null,controls=null,generation=0,library=null,previous=null;
function trusted(origin){return /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(origin)||origin==='https://script.google.com';}
function reply(type,extra){if(current)current.source.postMessage(Object.assign({type:type,id:current.id},extra||{}),current.origin);}
function stop(){generation++;if(controls){controls.stop();controls=null;}if(stream){stream.getTracks().forEach(function(t){t.stop();});stream=null;}video.srcObject=null;}
function close(type,extra){stop();reply(type||'slam-scan-cancel',extra);current=null;overlay.hidden=true;manual.value='';if(previous&&previous.focus)previous.focus();}
function load(){if(window.ZXingBrowser)return Promise.resolve(window.ZXingBrowser);if(library)return library;library=new Promise(function(resolve,reject){var script=document.createElement('script');script.src='https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js';script.integrity='sha384-ylLhng89kD62+PVK1cjm4rAYg69zDlGrbbSfAE2Eb8Xqf8RoAQCMcRoUXZh7pAPC';script.crossOrigin='anonymous';script.onload=function(){window.ZXingBrowser?resolve(window.ZXingBrowser):reject(Error('โหลดตัวอ่านบาร์โค้ดไม่สำเร็จ'));};script.onerror=function(){script.remove();library=null;reject(Error('โหลดตัวอ่านบาร์โค้ดไม่สำเร็จ กรุณาตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง'));};document.head.appendChild(script);});return library;}
async function scan(){stop();var run=generation;error.textContent='';status.textContent='กำลังขอใช้กล้อง…';start.disabled=true;try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Error('อุปกรณ์หรือเบราว์เซอร์นี้ไม่รองรับกล้อง กรุณาพิมพ์รหัสด้านล่าง');var feed=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});if(run!==generation||!current){feed.getTracks().forEach(function(t){t.stop();});return;}stream=feed;status.textContent='กำลังเปิดตัวอ่านบาร์โค้ด…';var z=await load();if(run!==generation||!current)return;var reader=new z.BrowserMultiFormatReader(undefined,{delayBetweenScanAttempts:200,delayBetweenScanSuccess:500});var control=await reader.decodeFromStream(feed,video,function(result){if(run!==generation||!current||!result)return;var value=String(result.getText()).trim().slice(0,3000);if(value)close('slam-scan-result',{value:value});});if(run!==generation||!current){control.stop();return;}controls=control;status.textContent='เล็งบาร์โค้ดในกรอบ ให้แสงเพียงพอและถือเครื่องให้นิ่ง';}catch(e){if(run!==generation||!current)return;stop();status.textContent='ใช้ช่องกรอกรหัส หรือกดลองเปิดกล้องอีกครั้ง';var name=e&&e.name;error.textContent=name==='NotAllowedError'?'ไม่ได้รับสิทธิ์กล้อง กรุณาอนุญาตกล้องในเบราว์เซอร์ แล้วลองใหม่':name==='NotFoundError'?'ไม่พบกล้องบนอุปกรณ์นี้':name==='NotReadableError'?'กล้องถูกใช้งานอยู่ กรุณาปิดแอปอื่นที่ใช้กล้อง':e.message||'เปิดกล้องไม่สำเร็จ';}finally{if(current)start.disabled=false;}}
window.addEventListener('message',function(e){if(!trusted(e.origin)||!e.source||!e.data||typeof e.data.id!=='string'||e.data.id.length>100)return;if(e.data.type==='slam-scan-close'&&current&&current.source===e.source&&current.id===e.data.id){close();return;}if(e.data.type!=='slam-scan-open')return;if(current)close();previous=document.activeElement;current={source:e.source,origin:e.origin,id:e.data.id};reply('slam-scan-ready');error.textContent='';status.textContent='กดเปิดกล้องเพื่อสแกน SKU / IMEI';start.disabled=false;overlay.hidden=false;document.getElementById('scan-close').focus();});
start.addEventListener('click',scan);document.getElementById('scan-close').addEventListener('click',function(){close();});document.getElementById('scan-use').addEventListener('click',function(){var value=manual.value.trim();if(value)close('slam-scan-result',{value:value.slice(0,3000)});});manual.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();document.getElementById('scan-use').click();}});
document.addEventListener('keydown',function(e){if(!current)return;if(e.key==='Escape')close();if(e.key==='Tab'){var items=Array.from(overlay.querySelectorAll('button:not(:disabled),input'));var first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'&&current)close();});window.addEventListener('pagehide',function(){if(current)close();});
})();
</script></body></html>
